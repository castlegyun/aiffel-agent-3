<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>심연의 생존자</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body data-state="menu">
  <canvas id="game"></canvas>

  <!-- 소리 상태 버튼: 꺼져 있으면 빗금, 아직 시작 전이면 깜빡임 -->
  <button id="btn-sound" aria-label="소리 켜기/끄기" title="소리 켜기/끄기 (M)">♪</button>

  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="warn"></div>
  <div id="awaken-flash"></div>
  <div id="announce"></div>

  <!-- ---- HUD (메뉴 화면에서는 숨김) ---- -->
  <div id="joy" class="hidden"><div id="joy-knob"></div></div>
  <button id="btn-pause-touch" class="hud" aria-label="일시정지">❚❚</button>

  <div id="warn-label" class="hud hidden"></div>
  <div id="timer" class="hud"><span id="timer-text">04:00</span></div>

  <div id="boss-hud" class="hud hidden">
    <div id="boss-name"></div>
    <div id="boss-bar"><div id="boss-fill"></div></div>
  </div>

  <div id="level-label" class="hud">Lv 1</div>
  <div id="xp-bar" class="hud"><div id="xp-fill"></div></div>

  <div id="side-hud" class="hud">
    <div id="awaken-badge" class="hidden"></div>
    <div id="kills">☠ <span id="kills-text">0</span></div>
    <div id="slots"></div>
  </div>

  <!-- ---- 화면(오버레이) ---- -->
  <div id="menu" class="overlay">
    <h1 class="title">심연의 생존자</h1>
    <p class="subtitle">4분 동안 살아남아라</p>
    <button id="btn-start" class="primary">게임 시작</button>
    <ul class="controls">
      <li class="kb-only"><b>WASD / 방향키</b><span>이동</span></li>
      <li class="touch-only"><b>화면 드래그</b><span>이동 (조이스틱)</span></li>
      <li><b>자동</b><span>공격 (가까운 적 조준)</span></li>
      <li class="kb-only"><b>ESC</b><span>일시정지</span></li>
      <li class="touch-only"><b>❚❚ 버튼</b><span>일시정지</span></li>
      <li class="kb-only"><b>M</b><span>소리 켜기 / 끄기</span></li>
    </ul>
    <div id="menu-best" class="best"></div>
    <div id="menu-sound" class="hint"></div>
  </div>

  <div id="paused" class="overlay hidden">
    <h1>일시정지</h1>
    <div class="buttons">
      <button id="btn-resume" class="primary">계속하기</button>
      <button id="btn-pause-restart">다시 시작</button>
      <button id="btn-pause-menu">메인 메뉴</button>
    </div>
    <span class="hint">ESC로 계속하기</span>
  </div>

  <div id="levelup" class="overlay hidden">
    <h1>레벨 업!</h1>
    <div id="cards"></div>
    <span class="hint">카드를 클릭하거나 1 · 2 · 3 키</span>
  </div>

  <div id="result" class="overlay hidden">
    <h1 id="result-title">GAME OVER</h1>
    <div id="result-record" class="record"></div>
    <div id="result-panel">
      <div id="result-rows"></div>
      <div class="result-sub">처치한 적</div>
      <div id="result-kills"></div>
      <div class="result-sub">장비한 무기</div>
      <div id="result-weapons"></div>
    </div>
    <div class="buttons">
      <button id="btn-retry" class="primary">다시 시작</button>
      <button id="btn-result-menu">메인 메뉴</button>
    </div>
    <span class="hint">Enter 또는 R</span>
  </div>

  <!-- type="module" 없이 순서대로 로드: 더블클릭으로 열어도 작동 -->
  <script src="js/config.js?v=3"></script>
  <script src="js/sfx.js?v=3"></script>
  <script src="js/music.js?v=3"></script>
  <script src="js/effects.js?v=3"></script>
  <script src="js/sprites.js?v=3"></script>
  <script src="js/entities.js?v=3"></script>
  <script src="js/ai.js?v=3"></script>
  <script src="js/weapons.js?v=3"></script>
  <script src="js/upgrades.js?v=3"></script>
  <script src="js/items.js?v=3"></script>
  <script src="js/awaken.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/background.js?v=3"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
