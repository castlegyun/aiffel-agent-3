<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM의 학습과 추론 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:       #f5f5f5;
      --ink:         #2d3142;
      --muted:       #4f5d75;
      --soft:        #5a6580;
      --accent:      #bf4520;
      --accent-tint: rgba(191,69,32,0.08);
      --node-fill:   #ffffff;
      --node-stroke: #2d3142;
      --font-sans:   'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:  'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:   'Geist Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper:       #2d3142;
        --ink:         #f5f5f5;
        --muted:       #bfc0c0;
        --soft:        #949eb2;
        --accent:      #f08a59;
        --accent-tint: rgba(240,138,89,0.10);
        --node-fill:   rgba(245,245,245,0.04);
        --node-stroke: rgba(245,245,245,0.45);
      }
    }
    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }
    .frame { max-width: 1200px; width: 100%; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .caption { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-top: 1rem; }
    svg { width: 100%; min-width: 752px; display: block; }
    .paper  { fill: var(--paper); }
    .node   { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1; }
    .focal  { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .line   { stroke: var(--muted); stroke-width: 1; fill: none; }
    .dashed { stroke-dasharray: 5,4; }
    .head   { fill: var(--muted); }
    .t-name { fill: var(--ink); font: 600 12px var(--font-sans); text-anchor: middle; }
    .t-sub  { fill: var(--muted); font: 400 12px var(--font-sans); text-anchor: middle; }
    .t-arrow { fill: var(--soft); font: 500 12px var(--font-sans); text-anchor: middle; }
    .t-row  { fill: var(--muted); font: 600 12px var(--font-sans); }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · training and inference</p>
    <h1>LLM의 학습과 추론 흐름</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 752 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="llm-flow-title llm-flow-desc">
        <title id="llm-flow-title">LLM의 학습과 추론 흐름</title>
        <desc id="llm-flow-desc">학습은 다음 토큰을 맞히고 틀린 만큼 가중치를 고치는 일을 되풀이하고, 추론은 고정된 가중치로 다음 토큰을 하나씩 골라 멈춤 토큰이 나올 때까지 입력에 더한다.</desc>
        <defs>
          <marker id="llm-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
        </defs>

        <rect class="paper" width="100%" height="100%"/>

        <!-- 줄 이름 -->
        <text class="t-row" x="24" y="40">학습 · 가중치를 고친다</text>
        <text class="t-row" x="24" y="212">추론 · 가중치는 그대로</text>

        <!-- 연결선 먼저, 상자는 나중에 -->
        <!-- 학습 줄 -->
        <line class="line" x1="152" y1="88" x2="200" y2="88" marker-end="url(#llm-flow-arrow)"/>
        <line class="line" x1="328" y1="88" x2="376" y2="88" marker-end="url(#llm-flow-arrow)"/>
        <line class="line" x1="504" y1="88" x2="552" y2="88" marker-end="url(#llm-flow-arrow)"/>
        <path class="line" d="M596 120 V136 Q596 144 588 144 H272 Q264 144 264 136 V120" marker-end="url(#llm-flow-arrow)"/>
        <rect class="paper" x="412" y="150" width="36" height="14"/>
        <text class="t-arrow" x="430" y="161">반복</text>

        <!-- 학습에서 추론으로 -->
        <path class="line dashed" d="M636 120 V176 Q636 184 628 184 H236 Q228 184 228 192 V224" marker-end="url(#llm-flow-arrow)"/>
        <rect class="paper" x="388" y="190" width="88" height="14"/>
        <text class="t-arrow" x="432" y="201">고정해서 사용</text>

        <!-- 추론 줄 -->
        <line class="line" x1="136" y1="256" x2="172" y2="256" marker-end="url(#llm-flow-arrow)"/>
        <line class="line" x1="284" y1="256" x2="320" y2="256" marker-end="url(#llm-flow-arrow)"/>
        <line class="line" x1="432" y1="256" x2="468" y2="256" marker-end="url(#llm-flow-arrow)"/>
        <line class="line" x1="580" y1="256" x2="616" y2="256" marker-end="url(#llm-flow-arrow)"/>
        <rect class="paper" x="588" y="236" width="20" height="14"/>
        <text class="t-arrow" x="598" y="247">예</text>
        <path class="line" d="M524 288 V312 Q524 320 516 320 H236 Q228 320 228 312 V288" marker-end="url(#llm-flow-arrow)"/>
        <rect class="paper" x="312" y="326" width="128" height="14"/>
        <text class="t-arrow" x="376" y="337">아니오 · 입력에 더함</text>

        <!-- 학습 상자 -->
        <rect class="paper" x="24" y="56" width="128" height="64" rx="6"/>
        <rect class="node" x="24" y="56" width="128" height="64" rx="6"/>
        <text class="t-name" x="88" y="84">글 → 토큰</text>
        <text class="t-sub" x="88" y="102">코퍼스를 쪼갬</text>

        <rect class="paper" x="200" y="56" width="128" height="64" rx="6"/>
        <rect class="node" x="200" y="56" width="128" height="64" rx="6"/>
        <text class="t-name" x="264" y="84">다음 토큰 맞히기</text>
        <text class="t-sub" x="264" y="102">다음 토큰은 가림</text>

        <rect class="paper" x="376" y="56" width="128" height="64" rx="6"/>
        <rect class="node" x="376" y="56" width="128" height="64" rx="6"/>
        <text class="t-name" x="440" y="84">정답과 비교</text>
        <text class="t-sub" x="440" y="102">틀린 정도 계산</text>

        <rect class="paper" x="552" y="56" width="128" height="64" rx="6"/>
        <rect class="focal" x="552" y="56" width="128" height="64" rx="6"/>
        <text class="t-name" x="616" y="84">가중치 조정</text>
        <text class="t-sub" x="616" y="102">역전파</text>

        <!-- 추론 상자 -->
        <rect class="paper" x="24" y="224" width="112" height="64" rx="6"/>
        <rect class="node" x="24" y="224" width="112" height="64" rx="6"/>
        <text class="t-name" x="80" y="252">입력 → 토큰</text>
        <text class="t-sub" x="80" y="270">토큰 ID로 바꿈</text>

        <rect class="paper" x="172" y="224" width="112" height="64" rx="6"/>
        <rect class="node" x="172" y="224" width="112" height="64" rx="6"/>
        <text class="t-name" x="228" y="246">다음 토큰 계산</text>
        <text class="t-sub" x="228" y="264">임베딩 · Attention</text>
        <text class="t-sub" x="228" y="280">Logit · Softmax</text>

        <rect class="paper" x="320" y="224" width="112" height="64" rx="6"/>
        <rect class="focal" x="320" y="224" width="112" height="64" rx="6"/>
        <text class="t-name" x="376" y="252">토큰 하나 고름</text>
        <text class="t-sub" x="376" y="270">Temperature 등</text>

        <polygon class="paper" points="524,224 580,256 524,288 468,256"/>
        <polygon class="node" points="524,224 580,256 524,288 468,256"/>
        <text class="t-name" x="524" y="260">멈춤 토큰?</text>

        <rect class="paper" x="616" y="224" width="112" height="64" rx="6"/>
        <rect class="node" x="616" y="224" width="112" height="64" rx="6"/>
        <text class="t-name" x="672" y="252">생성 끝</text>
        <text class="t-sub" x="672" y="270">답 완성</text>
      </svg>
    </div>

    <p class="caption">학습은 틀린 만큼 가중치를 고치며 되풀이한다. 학습이 끝난 가중치는 고정되고, 추론은 그 가중치로 토큰을 하나씩 골라 입력에 더한다. 멈춤 토큰이 나오면 생성이 끝난다.</p>
  </div>
</body>
</html>
