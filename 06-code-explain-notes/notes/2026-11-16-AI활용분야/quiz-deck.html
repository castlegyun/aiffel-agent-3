<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예상 퀴즈 표 모델</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1f2330;
    --muted: #5d6474;
    --line: #dcd8cf;
    --accent: #bf4520;
    --ok: #2f7d6d;
    --ok-soft: rgba(47,125,109,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171a22;
      --card: #222633;
      --ink: #eeece6;
      --muted: #a8adba;
      --line: #383d4c;
      --accent: #f08a59;
      --ok: #6cc5b0;
      --ok-soft: rgba(108,197,176,0.14);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; word-break: keep-all; overflow-wrap: break-word; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .stage { min-height: 100%; display: flex; flex-direction: column; padding: 3vh 4vw; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: clamp(14px, 1.6vw, 20px); color: var(--muted); }
  .pill { display: inline-block; padding: 4px 14px; border-radius: 999px; font-weight: 700; border: 2px solid currentColor; }
  .pill.q { color: var(--accent); }
  .pill.a { color: var(--ok); }
  .pill.s { color: var(--ink); }
  .card { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 1200px; width: 100%; margin: 2vh auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 3vh 5vw; }
  .qnum { font-size: clamp(16px, 2vw, 26px); font-weight: 800; color: var(--accent); margin-bottom: 1.2vh; }
  .qtext { font-size: clamp(22px, 3vw, 40px); font-weight: 800; line-height: 1.35; margin-bottom: 2.4vh; }
  ol.opts { list-style: none; display: grid; gap: 1.1vh; }
  ol.opts li { display: flex; gap: 0.7em; align-items: flex-start; font-size: clamp(16px, 2.1vw, 27px); line-height: 1.4; padding: 1vh 1.2vw; border: 2px solid var(--line); border-radius: 10px; }
  ol.opts li .no { flex: none; font-weight: 800; color: var(--muted); }
  /* 정답 화면 */
  .reveal ol.opts li { opacity: 0.38; }
  .reveal ol.opts li.right { opacity: 1; border-color: var(--ok); background: var(--ok-soft); font-weight: 700; }
  .reveal ol.opts li.right .no { color: var(--ok); }
  .why { margin-top: 2vh; font-size: clamp(15px, 1.8vw, 24px); line-height: 1.45; }
  .why b { color: var(--ok); }
  /* 정리 화면 */
  .sum-title { font-size: clamp(18px, 2.2vw, 28px); font-weight: 800; color: var(--accent); margin-bottom: 2.4vh; }
  .sum-text { font-size: clamp(22px, 3vw, 40px); font-weight: 700; line-height: 1.6; }
  .sum-text b { color: var(--ok); }
  .hint { text-align: center; font-size: clamp(13px, 1.4vw, 18px); color: var(--muted); }
  .fs { position: fixed; right: 14px; bottom: 12px; font: inherit; font-size: 14px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <span>예상 퀴즈 · 표 모델과 모델 비교</span>
    <span><span id="count"></span> &nbsp; <span class="pill" id="state"></span></span>
  </div>
  <div class="card" id="card"></div>
  <p class="hint" id="hint"></p>
</div>
<button class="fs" id="fs" type="button">전체 화면 (F)</button>

<script>
  // 문제마다: q = 문제, opts = 보기 4개, ans = 정답 번호(1~4), why = 해설 한 줄
  var QUIZ = [
    {
      q: '랜덤 포레스트와 TabICL의 "배우는 방식"으로 옳은 것은?',
      opts: [
        '랜덤 포레스트는 미리 배워 두고, TabICL은 내 표로 처음 배운다.',
        '랜덤 포레스트는 내 표로 배우고, TabICL은 미리 배운 뒤 내 표를 참고한다.',
        'TabICL은 아무것도 배우지 않고, 내 표만 보고 바로 답한다.',
        '둘 다 내 표를 받기 전에, 여러 표로 미리 배워 둔다.'
      ],
      ans: 2,
      why: '미리 배워 둔 쪽은 TabICL뿐이에요(사전학습). 내가 건넨 예시 행과 정답은 예측할 때 참고만 해요.'
    },
    {
      q: '새 모델을 시험할 때 기존 방법(기준선)도 같은 자료로 함께 돌리는 이유로 가장 알맞은 것은?',
      opts: [
        '기존 방법이 항상 새 모델보다 정확하기 때문에',
        '새 모델이 학습할 때 기존 방법의 답을 참고해야 하기 때문에',
        '시험 자료가 모자라서 기존 방법으로 채우기 위해',
        '새 모델 점수 하나만으로는 나아졌는지 알 수 없기 때문에'
      ],
      ans: 4,
      why: '같은 자료에서 기존 방법도 비슷하게 맞힌다면, 새 모델은 설치 수고만 늘릴 수 있어요.'
    },
    {
      q: '일부 자료를 따로 떼어 두고, 모든 모델에 같은 시험 자료를 쓰는 이유로 가장 옳은 것은?',
      opts: [
        '정답을 이미 알고 있는 자료로 채점하면, 실제 실력보다 결과가 좋게 나올 수 있어서',
        '떼어 둔 자료로 모델을 한 번 더 학습시켜, 점수를 끝까지 끌어올리려고',
        '자료를 전부 쓰면 학습이 느려져서, 일부만 써서 시간을 아끼려고',
        '모델마다 잘 맞히는 자료가 달라서, 각자 맞히기 쉬운 자료로 채점하려고'
      ],
      ans: 1,
      why: '떼어 둔 시험 자료는 학습에 쓰지 않고 정답을 감춰 둬요. 그리고 모든 모델을 같은 시험 자료로 채점해야 공정하게 비교할 수 있어요.'
    },
    {
      q: '날짜가 적힌 업무 기록을 훈련 자료와 시험 자료로 나눌 때, 행을 무작위로 섞어 나누면 안 되는 이유는?',
      opts: [
        '날짜 열은 숫자가 아니라서 모델이 읽지 못해서',
        '무작위로 나누면 훈련 자료가 너무 적어져서',
        '미래의 정보가 과거를 예측하는 데 섞일 수 있어서',
        '날짜 순서대로 나누면 정확도가 항상 올라가서'
      ],
      ans: 3,
      why: '섞어서 나누면 나중 날짜의 행이 훈련 자료에 들어가, 앞 날짜의 행을 맞히는 데 쓰일 수 있어요. 실제로 쓸 때는 미래를 모르니 시험 점수만 좋게 나올 수 있어요.'
    },
    {
      q: '불량을 찾는 모델의 정확도가 0.98로 나왔다. 이 숫자만으로 좋은 모델이라고 믿을 수 없는 이유는?',
      opts: [
        '부품 수가 적으면, 정확도는 언제나 실제보다 높게 나와서',
        '불량이 드물면, 전부 "정상"이라고만 답해도 0.98처럼 높게 나올 수 있어서',
        '0.98은 불량을 98% 찾았다는 뜻일 뿐, 정상은 따로 봐야 해서',
        '정확도는 불량을 맞힌 수만 세고, 정상을 맞힌 수는 안 세서'
      ],
      ans: 2,
      why: '예를 들어 100개 중 불량이 2개뿐이면, 측정값을 안 보고 전부 "정상"이라고 해도 98개를 맞혀 0.98이에요. 불량은 하나도 못 찾았는데도요. 그래서 점수의 순서도 함께 봐요.'
    },
    {
      q: 'AUC가 1에 가까운 모델인데도, 현장에 바로 쓰면 불량을 놓칠 수 있다. 왜일까?',
      opts: [
        'AUC는 순서만 보고, 몇 점부터 불량으로 볼지(선)는 따로 정해야 해서',
        'AUC가 1에 가까우면, 모델이 학습 자료를 외웠다는 뜻이라서',
        'AUC는 정상 부품의 점수만 보고, 불량 부품은 보지 않아서',
        'AUC는 높을수록, 불량을 덜 찾는 모델이라는 뜻이라서'
      ],
      ans: 1,
      why: '순서가 완벽해도 선을 잘못 그으면 불량을 다 놓칠 수 있어요. 몇 개까지 다시 검사할 수 있는지, 놓치면 얼마나 손해인지도 숫자가 정해 주지 않아요.'
    },
    {
      q: '예시 20개만 줬을 때 TabICL 점수가 랜덤 포레스트보다 조금 높았다. "TabICL이 더 좋은 모델"이라고 말하기 어려운 이유는?',
      opts: [
        'TabICL은 미리 배운 모델이라, 원래 점수를 비교하면 안 돼서',
        '예시가 20개뿐이면, 정확도와 AUC가 항상 0.5가 되어서',
        '자료를 다르게 뽑거나 다른 표로 하면, 순서가 바뀔 수 있어서',
        'TabICL은 매번 무작위로 답해서, 점수가 우연히 높게 나와서'
      ],
      ans: 3,
      why: '한 번 비교한 결과일 뿐이에요. 실습에서도 예시를 200개로 늘리자 세 모델 점수가 거의 같아졌어요.'
    },
    {
      q: '공개 자료에서 점수가 높았던 모델을, 회사 자료로 다시 시험해야 하는 이유로 가장 알맞은 것은?',
      opts: [
        '공개 자료로 시험하면 점수가 항상 낮게 나와서',
        '회사 표는 열의 뜻과 자료가 모인 과정이 달라, 점수가 이어진다는 보장이 없어서',
        '회사 자료가 더 많아서, 점수가 무조건 더 높게 나와서',
        '공개 자료는 정답 열이 없어서, 애초에 점수를 믿을 수 없어서'
      ],
      ans: 2,
      why: '또 미리 배워 둔 모델은 사전학습 때 그 공개 시험 문제를 이미 봤을 수도 있어요. 그러면 Q3처럼 "정답을 이미 아는 시험"이 되어 점수가 실제보다 좋게 나와요.'
    }
  ];
  var SUMMARY = '랜덤 포레스트는 내 표로 직접 배우고, TabICL은 미리 배워 둔 상태에서 내 표를 참고해요. ' +
                '하지만 새 방식이라고 더 낫다는 보장은 없어요.<br><br>' +
                '그래서 <b>같은 시험 자료</b>로, <b>기준선</b>과 함께, <b>정확도와 AUC</b> 두 숫자로 비교해야 해요.';

  var NO = ['①', '②', '③', '④'];
  // 화면 순서: 0 = 1번 문제, 1 = 1번 정답, 2 = 2번 문제, ... 마지막 = 정리
  var step = 0, last = QUIZ.length * 2;
  var card = document.getElementById('card');
  var st = document.getElementById('state'), hint = document.getElementById('hint');

  function render() {
    if (step === last) {
      document.getElementById('count').textContent = '';
      st.textContent = '정리';
      st.className = 'pill s';
      card.className = 'card';
      card.innerHTML = '<div class="sum-title">정리</div><div class="sum-text">' + SUMMARY + '</div>';
      hint.textContent = '끝 · ← 이전';
      return;
    }
    var i = Math.floor(step / 2), showAns = step % 2 === 1, item = QUIZ[i];
    document.getElementById('count').textContent = (i + 1) + ' / ' + QUIZ.length;
    st.textContent = showAns ? '정답' : '문제';
    st.className = 'pill ' + (showAns ? 'a' : 'q');
    var html = '<div class="qnum">Q' + (i + 1) + '</div><div class="qtext">' + item.q + '</div><ol class="opts">';
    item.opts.forEach(function (o, k) {
      var right = showAns && k + 1 === item.ans;
      html += '<li' + (right ? ' class="right"' : '') + '><span class="no">' + NO[k] + '</span><span>' + o + '</span></li>';
    });
    html += '</ol>';
    if (showAns) html += '<p class="why"><b>정답 ' + NO[item.ans - 1] + '</b> · ' + item.why + '</p>';
    card.innerHTML = html;
    card.className = 'card' + (showAns ? ' reveal' : '');
    hint.textContent = !showAns ? '클릭하면 정답이 나와요 · ← 이전'
      : (step === last - 1 ? '클릭하면 정리로 · ← 이전' : '클릭하면 다음 문제로 · ← 이전');
  }
  function next() { if (step < last) { step++; render(); } }
  function prev() { if (step > 0) { step--; render(); } }
  function toggleFs() {
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    } catch (e) {}
  }

  document.body.addEventListener('click', function (e) {
    if (e.target.closest('#fs')) return;
    next();
  });
  document.getElementById('fs').addEventListener('click', toggleFs);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'f' || e.key === 'F') toggleFs();
  });
  render();
</script>
</body>
</html>
