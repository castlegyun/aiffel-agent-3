<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그림과 글이 같은 공간의 점이 된다</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:       #f5f5f5;
      --ink:         #2d3142;
      --muted:       #4f5d75;
      --accent:      #bf4520;
      --accent-tint: rgba(191,69,32,0.08);
      --node-fill:   #ffffff;
      --node-stroke: #2d3142;
      --space-fill:  rgba(45,49,66,0.03);
      --font-sans:   'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:  'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:   'Geist Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper:       #2d3142;
        --ink:         #f5f5f5;
        --muted:       #bfc0c0;
        --accent:      #f08a59;
        --accent-tint: rgba(240,138,89,0.10);
        --node-fill:   rgba(245,245,245,0.04);
        --node-stroke: rgba(245,245,245,0.45);
        --space-fill:  rgba(245,245,245,0.03);
      }
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); min-height: 100vh; padding: 1.5rem 1rem; }
    .frame { max-width: 1200px; width: 100%; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 1rem; }
    .caption { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-top: 1rem; max-width: 768px; word-break: keep-all; overflow-wrap: break-word; }
    svg { width: 100%; min-width: 768px; display: block; }
    .paper  { fill: var(--paper); }
    .node   { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1; }
    .space  { fill: var(--space-fill); stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 4; }
    .line   { stroke: var(--muted); stroke-width: 1; fill: none; }
    .head   { fill: var(--muted); }
    .near   { stroke: var(--accent); stroke-width: 1.5; fill: none; }
    .far    { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    .dot-hi { fill: var(--accent); }
    .dot    { fill: var(--muted); }
    .t-name { fill: var(--ink); font: 600 13px var(--font-sans); text-anchor: middle; }
    .t-sub  { fill: var(--muted); font: 400 12px var(--font-sans); text-anchor: middle; }
    .t-mono { fill: var(--muted); font: 400 11px var(--font-mono); text-anchor: middle; }
    .t-pt   { fill: var(--ink); font: 400 12px var(--font-sans); }
    .t-near { fill: var(--accent); font: 600 12px var(--font-sans); }
    .t-far  { fill: var(--muted); font: 600 12px var(--font-sans); }
    .t-space{ fill: var(--muted); font: 600 12px var(--font-sans); }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · picture and text become points in one space</p>
    <h1>그림과 글이 같은 공간의 점이 된다</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 768 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pixel-title pixel-desc">
        <title id="pixel-title">그림과 글이 같은 공간의 점이 된다</title>
        <desc id="pixel-desc">개 사진은 이미지 인코더를, 두 영어 문장은 텍스트 인코더를 지나 각각 숫자 목록이 되고, 같은 임베딩 공간의 점으로 놓인다. 짝이 맞는 개 사진과 개 문장의 점은 가깝고, 고양이 문장의 점은 멀다.</desc>
        <defs>
          <marker id="pixel-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
        </defs>
        <rect class="paper" width="100%" height="100%"/>

        <!-- 임베딩 공간 (가장 먼저: 화살표가 위에 그려지도록) -->
        <rect class="space" x="384" y="8" width="380" height="284" rx="8"/>
        <text class="t-space" x="752" y="282" text-anchor="end">임베딩 공간 (하나의 좌표계)</text>

        <!-- 화살표: 입력 → 인코더 -->
        <line class="line" x1="124" y1="52"  x2="182" y2="52"  marker-end="url(#pixel-arrow)"/>
        <line class="line" x1="124" y1="148" x2="182" y2="148" marker-end="url(#pixel-arrow)"/>
        <line class="line" x1="124" y1="250" x2="182" y2="250" marker-end="url(#pixel-arrow)"/>

        <!-- 화살표: 인코더 → 공간의 점 (직각으로 꺾음) -->
        <path class="line" d="M324 52 H472 Q480 52 480 60 V92"  marker-end="url(#pixel-arrow)"/>
        <line class="line" x1="324" y1="148" x2="472" y2="148" marker-end="url(#pixel-arrow)"/>
        <path class="line" d="M324 250 H712 Q720 250 720 242 V108" marker-end="url(#pixel-arrow)"/>

        <!-- 입력 상자 -->
        <rect class="paper" x="4" y="24" width="120" height="56" rx="6"/>
        <rect class="node"  x="4" y="24" width="120" height="56" rx="6"/>
        <text class="t-name" x="64" y="49">개 사진</text>
        <text class="t-sub"  x="64" y="67">그림 한 장</text>

        <rect class="paper" x="4" y="120" width="120" height="56" rx="6"/>
        <rect class="node"  x="4" y="120" width="120" height="56" rx="6"/>
        <text class="t-mono" x="64" y="145">a photo of a dog</text>
        <text class="t-sub"  x="64" y="163">개 사진 한 장</text>

        <rect class="paper" x="4" y="222" width="120" height="56" rx="6"/>
        <rect class="node"  x="4" y="222" width="120" height="56" rx="6"/>
        <text class="t-mono" x="64" y="247">a photo of a cat</text>
        <text class="t-sub"  x="64" y="265">고양이 사진 한 장</text>

        <!-- 인코더 상자 -->
        <rect class="paper" x="184" y="24" width="140" height="56" rx="6"/>
        <rect class="node"  x="184" y="24" width="140" height="56" rx="6"/>
        <text class="t-name" x="254" y="49">이미지 인코더</text>
        <text class="t-sub"  x="254" y="67">그림 → 숫자 몇백 개</text>

        <rect class="paper" x="184" y="120" width="140" height="158" rx="6"/>
        <rect class="node"  x="184" y="120" width="140" height="158" rx="6"/>
        <text class="t-name" x="254" y="193">텍스트 인코더</text>
        <text class="t-sub"  x="254" y="211">문장 → 숫자 몇백 개</text>

        <!-- 점 사이 거리 -->
        <line class="near" x1="480" y1="106" x2="480" y2="142"/>
        <text class="t-near" x="490" y="128">가깝다 (짝이 맞음)</text>
        <line class="far"  x1="487" y1="100" x2="713" y2="100"/>
        <text class="t-far"  x="580" y="90" text-anchor="middle">멀다 (짝이 안 맞음)</text>

        <!-- 공간의 점 -->
        <circle class="dot-hi" cx="480" cy="100" r="6"/>
        <text class="t-pt" x="470" y="84" text-anchor="end">개 사진의 점</text>
        <circle class="dot-hi" cx="480" cy="148" r="6"/>
        <text class="t-pt" x="490" y="172">‘개’ 문장의 점</text>
        <circle class="dot" cx="720" cy="100" r="6"/>
        <text class="t-pt" x="752" y="84" text-anchor="end">‘고양이’ 문장의 점</text>
      </svg>
    </div>
    <p class="caption">숫자 목록 하나가 공간의 점 하나예요. 대조 학습은 짝이 맞는 그림·문장의 점은 가깝게, 짝이 안 맞는 쌍은 멀게 놓이도록 모델을 고쳐요. 그래서 그림을 설명문으로 바꾸지 않아도, 두 점 사이 거리를 계산해 어느 문장이 그림에 맞는지 비교할 수 있어요. 단, 가깝다고 같은 것은 아니에요.</p>
  </div>
</body>
</html>
