<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지와 글 연결 퀴즈</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --card: #ffffff;
      --ink: #2d3142;
      --muted: #4f5d75;
      --line: #d5d7dd;
      --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08);
      --ok: #1f7a4d;
      --ok-tint: rgba(31,122,77,0.10);
      --no: #b3261e;
      --no-tint: rgba(179,38,30,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #2d3142;
        --card: #353a4d;
        --ink: #f5f5f5;
        --muted: #bfc0c0;
        --line: #555b70;
        --accent: #f08a59;
        --accent-tint: rgba(240,138,89,0.12);
        --ok: #6fd3a0;
        --ok-tint: rgba(111,211,160,0.12);
        --no: #ff8a80;
        --no-tint: rgba(255,138,128,0.12);
      }
    }
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--paper); color: var(--ink); line-height: 1.65; padding: 1.5rem 1rem 3rem; word-break: keep-all; overflow-wrap: break-word; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.4rem; }
    h1 { font-size: 1.5rem; font-weight: 600; line-height: 1.35; margin-bottom: 0.5rem; }
    .lead { color: var(--muted); margin-bottom: 1rem; }
    .bar { position: sticky; top: 0; z-index: 1; background: var(--paper); padding: 0.6rem 0; margin-bottom: 1rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 1rem; font-size: 0.95rem; }
    .bar strong { color: var(--accent); }
    .q { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.1rem 1rem; margin-bottom: 1rem; }
    .q-num { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-bottom: 0.3rem; }
    .q-text { font-weight: 600; margin-bottom: 0.8rem; }
    .choices { display: flex; flex-direction: column; gap: 0.5rem; }
    .choice { font: inherit; color: var(--ink); text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 0.65rem 0.8rem; cursor: pointer; display: flex; gap: 0.6rem; }
    .choice:hover:not(:disabled) { border-color: var(--accent); }
    .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .choice:disabled { cursor: default; }
    .choice .mark { flex: none; font-weight: 600; color: var(--muted); min-width: 1.2rem; }
    .choice.right { border-color: var(--ok); background: var(--ok-tint); }
    .choice.right .mark { color: var(--ok); }
    .choice.picked-wrong { border-color: var(--no); background: var(--no-tint); }
    .choice.picked-wrong .mark { color: var(--no); }
    .feedback { margin-top: 0.8rem; padding: 0.8rem; border-radius: 6px; border-left: 3px solid var(--line); background: var(--paper); }
    .feedback[hidden] { display: none; }
    .verdict { font-weight: 600; margin-bottom: 0.3rem; }
    .verdict.ok { color: var(--ok); }
    .verdict.no { color: var(--no); }
    .feedback p + p { margin-top: 0.4rem; }
    .label { font-weight: 600; }
    .result { background: var(--accent-tint); border: 1px solid var(--accent); border-radius: 8px; padding: 1.1rem 1rem; text-align: center; }
    .result[hidden] { display: none; }
    .result .score { font-size: 1.6rem; font-weight: 600; color: var(--accent); margin-bottom: 0.3rem; }
    .q[hidden] { display: none; }
    .next { display: block; width: 100%; font: inherit; font-weight: 600; margin-top: 0.8rem; padding: 0.7rem 1rem; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--paper); cursor: pointer; }
    .next[hidden] { display: none; }
    .next:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .retry { font: inherit; margin-top: 0.8rem; padding: 0.55rem 1.2rem; border-radius: 6px; border: 1px solid var(--accent); background: var(--card); color: var(--ink); cursor: pointer; }
    .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">퀴즈 · 픽셀을 문장처럼 다룬다는 발상</p>
    <h1>이미지와 글은 어떻게 연결될까요?</h1>
    <p class="lead">객관식 10문제를 한 문제씩 풀어요. 보기를 누르면 바로 맞았는지와 해설이 나와요. 틀린 보기를 골랐으면 그 보기가 왜 틀렸는지도 함께 나와요. 해설을 읽고 [다음 문제]를 누르세요.</p>
    <div class="bar" aria-live="polite"><span>문제 <strong id="pos">1</strong> / 10</span><span>맞은 문제 <strong id="score">0</strong></span></div>
    <div id="quiz"></div>
    <div class="result" id="result" hidden aria-live="polite">
      <p class="score" id="final"></p>
      <p id="final-msg"></p>
      <button type="button" class="retry" id="retry">다시 풀기</button>
    </div>
  </div>

  <script>
    // answer: 정답 보기 번호(0부터). wrong[i]: i번 보기를 골랐을 때 왜 틀렸는지 (정답 칸은 빈 글자)
    const QUESTIONS = [
      {
        q: '대조 학습(contrastive learning, 컨트래스티브 러닝)은 모델이 무엇을 하도록 학습시키나요?',
        choices: [
          '이미지를 보고 그 내용을 설명하는 문장을 먼저 써내도록 학습시킨다',

          '이미지의 픽셀 하나하나를 빠짐없이 그대로 기억하도록 학습시킨다',

        ],
        answer: 1,
        why: '원문의 정의 그대로예요. 대조 학습은 짝이 맞는 쌍과 맞지 않는 쌍의 거리를 서로 다르게 만드는 학습이에요. 그래서 학습이 끝나면 거리로 어느 설명이 어느 그림에 가까운지 비교할 수 있어요.',
        wrong: [
          '대조 학습은 설명문을 만드는 학습이 아니에요. 이미지와 설명이 놓이는 위치(거리)를 맞추는 학습이에요. 원문은 오히려 설명문으로 바꾸지 않고도 비교할 수 있다고 말해요.',
          '',
          '원문은 이미지를 픽셀 그대로 기억하지 않는다고 말해요. 업무에 쓸 수 있는 특징을 숫자 벡터로 압축해요.',

      {

        choices: [

          '사람이 소리를 끝까지 들은 뒤, 그 특징을 직접 숫자로 적어 넣는다'

        why: '원문은 "음성도 파형 그대로가 아니라 발화 내용, 억양, 속도, 배경음 같은 단서를 모델이 처리할 수 있는 형태로 바꾼다"고 말해요. 표현은 원본을 복사한 것이 아니라 일에 쓸 특징을 숫자로 압축한 것이에요.',
        wrong: [

          '원문이 든 단서 목록에는 억양, 속도, 배경음도 들어 있어요. 발화 내용만 남기는 것이 아니에요.',
          '',
          '숫자 목록은 인코더가 만들어요. 사람이 직접 적어 넣는다는 내용은 원문에 없어요.'
        ]
      },
      {
        q: 'CLIP(클립)에 대한 설명으로 맞는 것은 무엇인가요?',
        choices: [

        why: '원문은 "가깝다"가 곧 "같다"는 뜻이 아니라고 말해요. 거리는 학습 데이터의 통계적 관계라서, 그 업무에서 진짜 중요한 차이를 항상 잡아내지는 못해요. 그래서 가깝다는 이유만으로 같은 것으로 취급하면 안 돼요.',
        wrong: [
          '거리 계산이 무작위로 바뀐다는 내용은 원문에 없어요. 문제는 거리가 무엇을 기준으로 배운 것이냐예요.',
          '원문은 반대로 "가깝다는 것이 곧 정답은 아니다"라고 말해요. 속도 이야기도 아니에요.',
          '',
          '원문은 거리가 느낌이 아니라 "측정 가능한 거리"라고 강조해요. 숫자로 잴 수는 있지만, 그 숫자가 업무상 같음을 보장하지 않는 거예요.'

      },
      {

        choices: [

          '',

          '답이 길고 자세할수록 그만큼 더 정확해지기 때문',

          '이 질문 방식은 설명문 변환과 관계가 없어요. 모델의 답을 검토하기 쉽게 만드는 방법이에요.',
          ''

    const LETTERS = ['①', '②', '③', '④'];
    const quizEl = document.getElementById('quiz');
    const posEl = document.getElementById('pos');
    const scoreEl = document.getElementById('score');
    const resultEl = document.getElementById('result');
    let score = 0;
    let sections = [];

    function show(i) {
      sections.forEach((s, k) => { s.hidden = k !== i; });
      posEl.textContent = String(i + 1);
      window.scrollTo(0, 0);
      const first = sections[i].querySelector('.choice');
      if (first) first.focus({ preventScroll: true });
    }

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render() {
      score = 0;
      scoreEl.textContent = '0';
      resultEl.hidden = true;
      quizEl.textContent = '';
      sections = QUESTIONS.map((item, qi) => {
        const box = el('section', 'q');
        box.appendChild(el('p', 'q-num', '문제 ' + (qi + 1)));
        box.appendChild(el('p', 'q-text', item.q));
        const list = el('div', 'choices');
        const fb = el('div', 'feedback');
        fb.hidden = true;
        const last = qi === QUESTIONS.length - 1;
        const next = el('button', 'next', last ? '결과 보기' : '다음 문제 →');
        next.type = 'button';
        next.hidden = true;
        next.addEventListener('click', () => {
          if (last) finish(); else show(qi + 1);
        });
        const buttons = item.choices.map((text, ci) => {
          const b = el('button', 'choice');
          b.type = 'button';
          b.appendChild(el('span', 'mark', LETTERS[ci]));
          b.appendChild(el('span', '', text));
          b.addEventListener('click', () => pick(item, ci, buttons, fb, next));
          list.appendChild(b);
          return b;
        });
        box.appendChild(list);
        box.appendChild(fb);
        box.appendChild(next);
        quizEl.appendChild(box);
        return box;
      });
      show(0);
    }

    function pick(item, ci, buttons, fb, next) {
      const correct = ci === item.answer;
      buttons.forEach(b => { b.disabled = true; });
      buttons[item.answer].classList.add('right');
      buttons[item.answer].querySelector('.mark').textContent = '✓';
      if (!correct) {
        buttons[ci].classList.add('picked-wrong');
        buttons[ci].querySelector('.mark').textContent = '✗';
      }
      fb.textContent = '';
      fb.appendChild(el('p', 'verdict ' + (correct ? 'ok' : 'no'),
        correct ? '✓ 맞았어요' : '✗ 틀렸어요 · 정답은 ' + LETTERS[item.answer] + '이에요'));
      if (!correct) {
        const p = el('p');
        p.appendChild(el('span', 'label', '고른 보기(' + LETTERS[ci] + ')가 틀린 이유: '));
        p.appendChild(document.createTextNode(item.wrong[ci]));
        fb.appendChild(p);
      }
      const w = el('p');
      w.appendChild(el('span', 'label', '정답 해설: '));
      w.appendChild(document.createTextNode(item.why));
      fb.appendChild(w);
      fb.hidden = false;
      next.hidden = false;
      next.focus({ preventScroll: true });

      if (correct) score += 1;
      scoreEl.textContent = String(score);
    }

    function finish() {
      sections.forEach(s => { s.hidden = true; });
      window.scrollTo(0, 0);
      document.getElementById('final').textContent = score + ' / ' + QUESTIONS.length;
      let msg;
      if (score === QUESTIONS.length) msg = '모두 맞았어요. 이 부분의 핵심을 다 잡았어요.';
      else if (score >= 7) msg = '대부분 맞았어요. 틀린 문제의 해설만 다시 읽어 보세요.';
      else msg = '틀린 문제의 해설을 읽고, 원문의 해당 부분을 다시 본 뒤 한 번 더 풀어 보세요.';
      document.getElementById('final-msg').textContent = msg;
      resultEl.hidden = false;
    }

    document.getElementById('retry').addEventListener('click', render);

    render();
  </script>
</body>
