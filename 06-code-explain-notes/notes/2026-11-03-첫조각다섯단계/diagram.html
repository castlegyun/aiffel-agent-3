<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>굴러가는 첫 조각의 다섯 단계</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:       #f5f5f5;
      --ink:         #2d3142;
      --muted:       #4f5d75;
      --soft:        #5a6580;
      --accent:      #bf4520;
      --accent-tint: rgba(191,69,32,0.08);
      --node-fill:   #ffffff;
      --node-stroke: #2d3142;
      --font-sans:   'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:  'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:   'Geist Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper:       #2d3142;
        --ink:         #f5f5f5;
        --muted:       #bfc0c0;
        --soft:        #949eb2;
        --accent:      #f08a59;
        --accent-tint: rgba(240,138,89,0.10);
        --node-fill:   rgba(245,245,245,0.04);
        --node-stroke: rgba(245,245,245,0.45);
      }
    }
    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }
    .frame { max-width: 1200px; width: 100%; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .caption { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-top: 1rem; }
    svg { width: 100%; min-width: 720px; display: block; }
    .paper  { fill: var(--paper); }
    .node   { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1; }
    .focal  { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .line   { stroke: var(--muted); stroke-width: 1; fill: none; }
    .dashed { stroke-dasharray: 5,4; }
    .head   { fill: var(--muted); }
    .t-name { fill: var(--ink); font: 600 12px var(--font-sans); text-anchor: middle; }
    .t-sub  { fill: var(--muted); font: 400 12px var(--font-sans); text-anchor: middle; }
    .t-arrow { fill: var(--soft); font: 500 12px var(--font-sans); text-anchor: middle; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · five steps</p>
    <h1>굴러가는 첫 조각을 만드는 다섯 단계</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 720 168" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="five-flow-title five-flow-desc">
        <title id="five-flow-title">굴러가는 첫 조각의 다섯 단계</title>
        <desc id="five-flow-desc">기획서를 쓰고, 작업대를 정하고, 화면을 만들고, 저장을 붙이고, 한 바퀴 확인한 뒤 배포하는 다섯 단계가 순서대로 이어지는 흐름을 보여 준다.</desc>
        <defs>
          <marker id="five-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
        </defs>

        <rect class="paper" width="100%" height="100%"/>

        <!-- 연결선 먼저, 상자는 나중에 -->
        <line class="line" x1="120" y1="84" x2="168" y2="84" marker-end="url(#five-flow-arrow)"/>
        <line class="line" x1="264" y1="84" x2="312" y2="84" marker-end="url(#five-flow-arrow)"/>
        <line class="line" x1="408" y1="84" x2="456" y2="84" marker-end="url(#five-flow-arrow)"/>
        <line class="line" x1="552" y1="84" x2="600" y2="84" marker-end="url(#five-flow-arrow)"/>

        <rect class="paper" x="24" y="48" width="96" height="72" rx="6"/>
        <rect class="node" x="24" y="48" width="96" height="72" rx="6"/>
        <text class="t-name" x="72" y="76">1. 기획서</text>
        <text class="t-sub" x="72" y="94">무엇을·왜</text>

        <rect class="paper" x="168" y="48" width="96" height="72" rx="6"/>
        <rect class="node" x="168" y="48" width="96" height="72" rx="6"/>
        <text class="t-name" x="216" y="76">2. 작업대</text>
        <text class="t-sub" x="216" y="94">어디서 만들지</text>

        <rect class="paper" x="312" y="48" width="96" height="72" rx="6"/>
        <rect class="node" x="312" y="48" width="96" height="72" rx="6"/>
        <text class="t-name" x="360" y="76">3. 화면</text>
        <text class="t-sub" x="360" y="94">HTML·CSS·JS</text>

        <rect class="paper" x="456" y="48" width="96" height="72" rx="6"/>
        <rect class="node" x="456" y="48" width="96" height="72" rx="6"/>
        <text class="t-name" x="504" y="76">4. 저장</text>
        <text class="t-sub" x="504" y="94">서버 · DB</text>
        <text class="t-sub" x="504" y="110">비밀값 관리</text>

        <rect class="paper" x="600" y="48" width="96" height="72" rx="6"/>
        <rect class="focal" x="600" y="48" width="96" height="72" rx="6"/>
        <text class="t-name" x="648" y="76">5. 확인·배포</text>
        <text class="t-sub" x="648" y="94">한 바퀴 확인</text>
      </svg>
    </div>

    <p class="caption">범위를 좁히고 다섯 단계를 한 걸음씩 밟아 굴러가는 첫 조각까지 간다. 완성이 아니라 이 첫 조각이 오늘의 목표다.</p>
  </div>
</body>
</html>
