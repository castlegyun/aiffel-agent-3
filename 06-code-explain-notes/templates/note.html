<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · 코드 해설 노트</title>
<style>
  :root { --bg:#fafaf7; --fg:#222; --muted:#666; --line:#ddd; --accent:#2f6fed; --code:#f0efe9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1b1a; --fg:#eee; --muted:#aaa; --line:#3a3a38; --accent:#7aa2ff; --code:#262624; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  a { color:var(--accent); }
  h1 { font-size:1.6rem; margin:8px 0 4px; }
  .summary { color:var(--muted); margin:0 0 20px; }
  .terms { border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:20px; }
  .terms h2 { font-size:1rem; margin:0 0 6px; }
  .terms ul { margin:0; padding-left:20px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { background:none; border:0; border-bottom:3px solid transparent; padding:8px 14px; font:inherit; color:var(--muted); cursor:pointer; }
  .tabs button[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--accent); font-weight:600; }
  .panel[hidden] { display:none; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--line); }
  td.n { width:2.5em; color:var(--muted); }
  code, pre { background:var(--code); border-radius:4px; font:14px/1.5 Consolas, monospace; }
  code { padding:1px 5px; white-space:pre-wrap; }
  .words li { margin:4px 0; }
  .nav { margin-bottom:8px; font-size:.9rem; }
  .visual-kind, .visual-reason { margin:4px 0; }
  .visual-note { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <div class="nav"><a href="../../index.html">← 노트 보관함</a></div>
  <h1>{{TITLE}}</h1>
  <p class="summary">{{SUMMARY}}</p>

  <section class="terms">
    <h2>새 용어</h2>
    <ul>
{{TERMS}}
    </ul>
  </section>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="flow">흐름</button>
    <button role="tab" aria-selected="false" data-tab="detail">자세히</button>
    <button role="tab" aria-selected="false" data-tab="words">단어장</button>
    <button role="tab" aria-selected="false" data-tab="visual">그림</button>
  </div>

  <section class="panel" id="flow">
    <table>
      <thead><tr><th>줄</th><th>코드</th><th>전체에서 하는 역할</th></tr></thead>
      <tbody>
{{FLOW_ROWS}}
      </tbody>
    </table>
  </section>

  <section class="panel" id="detail" hidden>
    <table>
      <thead><tr><th>줄</th><th>코드</th><th>실제로 일어나는 일</th></tr></thead>
      <tbody>
{{DETAIL_ROWS}}
      </tbody>
    </table>
  </section>

  <section class="panel" id="words" hidden>
    <ul class="words">
{{WORDS}}
    </ul>
  </section>
  <section class="panel" id="visual" hidden>
{{VISUAL}}
  </section>
</main>
<script>
  const tabs = document.querySelectorAll('.tabs button');
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      tabs.forEach(function (x) {
        const on = x === b;
        x.setAttribute('aria-selected', on);
        document.getElementById(x.dataset.tab).hidden = !on;
      });
    });
  });
</script>
</body>
</html>
