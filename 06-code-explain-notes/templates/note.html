<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · 코드 해설 노트</title>
<style>
  /* 디자인 규칙: DESIGN.md (GitHub 스타일) */
  :root {
    --canvas:#ffffff; --subtle:#f6f8fa; --border:#d0d7de; --fg:#1f2328; --muted:#656d76; --link:#0969da;
    --tab-line:#fd8c73; --code-bg:rgba(175,184,193,.2);
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas:#0d1117; --subtle:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#a0a9b4; --link:#4493f8;
      --tab-line:#f78166; --code-bg:rgba(110,118,129,.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); color:var(--fg); font:400 1.0625rem/1.65 var(--font-body); word-break:keep-all; overflow-wrap:break-word; }
  main { max-width:920px; margin:0 auto; padding:24px 16px 48px; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--link); outline-offset:2px; }
  h1 { font-size:1.875rem; line-height:1.25; font-weight:600; margin:8px 0 8px; }
  .summary { color:var(--muted); font-size:1rem; margin:0 0 16px; max-width:68ch; }
  .nav { margin-bottom:8px; font-size:.9375rem; }
  .terms { background:var(--subtle); border:1px solid var(--border); border-radius:6px; padding:10px 16px; margin-bottom:16px; font-size:1rem; }
  .terms h2 { font-size:1rem; margin:0 0 6px; }
  .terms summary { cursor:pointer; }
  .terms ul { margin:8px 0 0; padding-left:20px; color:var(--fg); }
  .flow-frame { width:100%; height:600px; border:1px solid var(--border); border-radius:6px; margin:0 0 16px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { font:inherit; font-size:1rem; background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; padding:10px 18px; color:var(--muted); cursor:pointer; border-radius:6px 6px 0 0; }
  .tabs button:hover { color:var(--fg); background:var(--subtle); }
  .tabs button[aria-selected="true"] { color:var(--fg); font-weight:600; border-bottom-color:var(--tab-line); }
  .panel[hidden] { display:none; }
  table { width:100%; border-collapse:collapse; font-size:1rem; }
  th, td { text-align:left; vertical-align:top; padding:8px 14px; border:1px solid var(--border); }
  th { background:var(--subtle); font-weight:600; }
  td.n { width:2.5em; font-family:var(--font-mono); color:var(--muted); }
  td:nth-child(2) { min-width:14em; }
  /* 좁은 화면: 둘째 칸 최소 폭을 줄여 표가 화면 안에 들어오게 한다. 칸보다 긴 낱말·코드 조각만 줄을 바꾸고, 그래도 넓으면 페이지 대신 탭 안에서 가로로 움직인다 */
  @media (max-width:600px) {
    td:nth-child(2) { min-width:9em; }
    th, td { padding:8px; }
    .panel { overflow-x:auto; }
    td { overflow-wrap:anywhere; }
  }
  code, pre { background:var(--code-bg); border-radius:6px; font:.85em/1.5 var(--font-mono); }
  code { padding:.2em .4em; white-space:pre-wrap; }
  pre { padding:12px 16px; overflow:auto; }
  .words li, .points li { margin:4px 0; }
  .visual-kind, .visual-reason { margin:4px 0; }
  .visual-buttons { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0; }
  .visual-buttons button { font:inherit; font-size:1rem; font-weight:500; padding:6px 18px; border:1px solid var(--border); border-radius:6px; background:var(--subtle); color:var(--fg); cursor:pointer; }
  .visual-buttons button[aria-pressed="true"] { border-color:var(--link); color:var(--link); }
  .visual-buttons button:disabled { opacity:.5; cursor:default; }
  #visual-frame { width:100%; height:75vh; border:1px solid var(--border); border-radius:6px; background:#fff; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration:.01ms !important; } }
  /* 목록 점: 기본 점은 글자색을 따라가 어두운 화면에서 안 보일 수 있어 고정 색 점을 쓴다 */
  .points, .terms ul, .words { list-style:none; padding-left:0; }
  .points li, .terms li, .words li { position:relative; padding-left:1.5em; }
  .points li::before, .terms li::before, .words li::before { content:""; position:absolute; left:.25em; top:.72em; width:.55em; height:.55em; border-radius:50%; background:var(--tab-line); }
</style>
</head>
<body>
<main>
  <div class="nav"><a href="../../index.html">← 노트 보관함</a></div>
  <h1>{{TITLE}}</h1>
  <p class="summary">{{SUMMARY}}</p>

  <details class="terms">
    <summary><strong>새 용어 {{TERMS_COUNT}}개</strong> (눌러서 펼치기)</summary>
    <ul>
{{TERMS}}
    </ul>
  </details>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="flow">흐름</button>
    <button role="tab" aria-selected="false" data-tab="visual">그림</button>
    <button role="tab" aria-selected="false" data-tab="detail">자세히</button>
    <button role="tab" aria-selected="false" data-tab="words">단어장</button>
  </div>

  <section class="panel" id="flow">
{{FLOW_FRAME}}
    <table>
      <thead><tr><th>줄</th><th>코드</th><th>전체에서 하는 역할</th></tr></thead>
      <tbody>
{{FLOW_ROWS}}
      </tbody>
    </table>
  </section>

  <section class="panel" id="detail" hidden>
    <table>
      <thead><tr><th>줄</th><th>코드</th><th>실제로 일어나는 일</th></tr></thead>
      <tbody>
{{DETAIL_ROWS}}
      </tbody>
    </table>
  </section>

  <section class="panel" id="words" hidden>
    <ul class="words">
{{WORDS}}
    </ul>
  </section>
  <section class="panel" id="visual" hidden>
    <p class="visual-kind"><strong>그림 종류:</strong> {{VISUAL_KIND}}</p>
    <p class="visual-reason">{{VISUAL_REASON}}</p>
    <div class="visual-buttons">
{{VISUAL_BUTTONS}}
      <a id="visual-open" href="#" target="_blank" rel="noopener" hidden>새 탭으로 열기</a>
    </div>
    <iframe id="visual-frame" title="그림 보기" hidden></iframe>
  </section>
</main>
<script>
  const tabs = document.querySelectorAll('.tabs button');
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      tabs.forEach(function (x) {
        const on = x === b;
        x.setAttribute('aria-selected', on);
        document.getElementById(x.dataset.tab).hidden = !on;
      });
    });
  });
  const frame = document.getElementById('visual-frame');
  const openLink = document.getElementById('visual-open');
  const vbtns = document.querySelectorAll('.visual-buttons button[data-src]');
  vbtns.forEach(function (b) {
    b.addEventListener('click', function () {
      vbtns.forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      frame.src = b.dataset.src;
      frame.hidden = false;
      openLink.href = b.dataset.src;
      openLink.hidden = false;
    });
  });
  // 그림(diagram.html)은 프레임 높이를 그림 크기에 맞춘다. 그림 파일은 고치지 않고 불러올 때 스타일을 얹는다.
  function fitDiagram(f) {
    try {
      const d = f.contentDocument;
      if (!d || !/diagram\.html$/.test(f.contentWindow.location.pathname)) { f.style.height = ''; return; }
      if (d.getElementById('fit-fix')) return;
      const st = d.createElement('style');
      st.id = 'fit-fix';
      st.textContent = 'body{min-height:0;display:flex;align-items:center;justify-content:center}';
      d.head.appendChild(st);
      const fit = function () { f.style.height = (d.body.offsetHeight + 2) + 'px'; };
      fit();
      if (d.fonts && d.fonts.ready) d.fonts.ready.then(fit);
      if (f.contentWindow.ResizeObserver) new f.contentWindow.ResizeObserver(fit).observe(d.body);
    } catch (e) { /* file:// 에서는 기본 높이를 유지한다 */ }
  }
  [document.querySelector('.flow-frame'), document.getElementById('visual-frame')].forEach(function (f) {
    if (f) f.addEventListener('load', function () { fitDiagram(f); });
  });
</script>
</body>
</html>
