<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 해설 노트 보관함</title>
<style>
  /* 디자인 규칙: DESIGN.md (GitHub 스타일) */
  :root {
    --canvas:#ffffff; --subtle:#f6f8fa; --border:#d0d7de; --fg:#1f2328; --muted:#656d76; --link:#0969da;
    --tab-line:#fd8c73; --count-bg:rgba(175,184,193,.2);
    --blue-bg:#ddf4ff; --blue-fg:#0969da; --green-bg:#dafbe1; --green-fg:#1a7f37;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas:#0d1117; --subtle:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#a0a9b4; --link:#4493f8;
      --tab-line:#f78166; --count-bg:rgba(110,118,129,.4);
      --blue-bg:rgba(56,139,253,.15); --blue-fg:#4493f8; --green-bg:rgba(46,160,67,.15); --green-fg:#3fb950;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--canvas); color:var(--fg); font:400 1rem/1.55 var(--font-body); word-break:keep-all; overflow-wrap:break-word; }
  a { color:inherit; text-decoration:none; }
  :focus-visible { outline:2px solid var(--link); outline-offset:2px; }

  main { max-width:1040px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:1.875rem; line-height:1.25; font-weight:600; margin:0 0 4px; }
  .lead { color:var(--muted); margin:0 0 16px; max-width:68ch; }

  .box { border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .head { display:flex; gap:8px; align-items:center; background:var(--subtle); border-bottom:1px solid var(--border); padding:0 16px; min-height:48px; flex-wrap:wrap; }
  .tab { font:inherit; color:var(--muted); background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; height:48px; padding:0 8px; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .tab:hover { color:var(--fg); }
  .tab[aria-pressed="true"] { color:var(--fg); font-weight:600; border-bottom-color:var(--tab-line); }
  .count { background:var(--count-bg); border-radius:2em; padding:0 7px; font-size:.8125rem; font-weight:500; line-height:20px; color:var(--fg); }

  .rows { list-style:none; margin:0; padding:0; }
  .row a { display:grid; grid-template-columns:1fr auto; gap:12px; padding:12px 16px; border-top:1px solid var(--border); }
  .row:first-child a { border-top:0; }
  .row a:hover { background:var(--subtle); }
  .row a:hover .t { color:var(--link); }
  .t { font-weight:600; font-size:1.0625rem; }
  .lab { display:inline-block; font-size:.8125rem; font-weight:500; line-height:20px; padding:0 8px; border-radius:2em; margin-left:6px; vertical-align:1px; }
  .lab.text { background:var(--blue-bg); color:var(--blue-fg); }
  .lab.code { background:var(--green-bg); color:var(--green-fg); }
  .s { font-size:.9375rem; color:var(--muted); margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .d { font:400 .8125rem/1.5 var(--font-mono); color:var(--muted); align-self:center; white-space:nowrap; }
  .msg { color:var(--muted); padding:16px; margin:0; }

  @media (max-width:640px) { .row a { grid-template-columns:1fr; gap:2px; } .d { align-self:start; } }
</style>
</head>
<body>
<main>
  <h1>코드 해설 노트 보관함</h1>
  <p class="lead">코드를 쉬운 주석, 단어장, 그림으로 바꿔 모아 둔 노트입니다. 최신 노트가 위에 있습니다.</p>

  <section class="box">
    <div class="head" role="group" aria-label="종류" id="tabs" hidden>
      <button class="tab" data-f="all" aria-pressed="true">전체 <span class="count" id="c-all">0</span></button>
      <button class="tab" data-f="code" aria-pressed="false">코드 <span class="count" id="c-code">0</span></button>
      <button class="tab" data-f="text" aria-pressed="false">텍스트 <span class="count" id="c-text">0</span></button>
    </div>
    <ul class="rows" id="list"></ul>
    <p class="msg" id="msg">불러오는 중…</p>
  </section>
</main>
<script>
  const list = document.getElementById('list');
  const msg = document.getElementById('msg');
  const tabsBox = document.getElementById('tabs');

  function show(text) { msg.textContent = text; msg.hidden = false; }

  fetch('notes/index.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (notes) {
      if (!notes.length) { show('아직 노트가 없습니다. Claude Code에서 /explain-code 로 만들어 보세요.'); return; }
      notes.sort(function (a, b) { return b.date.localeCompare(a.date); });
      msg.hidden = true;

      const codeCount = notes.filter(function (n) { return n.type !== 'text'; }).length;
      document.getElementById('c-all').textContent = notes.length;
      document.getElementById('c-code').textContent = codeCount;
      document.getElementById('c-text').textContent = notes.length - codeCount;
      tabsBox.hidden = false;

      const rows = [];
      notes.forEach(function (n) {
        const li = document.createElement('li');
        li.className = 'row';
        const kind = n.type === 'text' ? 'text' : 'code';
        li.dataset.kind = kind;
        const a = document.createElement('a');
        a.href = 'notes/' + encodeURIComponent(n.id) + '/index.html';
        const box = document.createElement('div');
        const t = document.createElement('span');
        t.className = 't';
        t.textContent = n.title;
        const lab = document.createElement('span');
        lab.className = 'lab ' + kind;
        lab.textContent = kind === 'text' ? '텍스트' : '코드';
        const s = document.createElement('div');
        s.className = 's';
        s.textContent = n.summary;
        box.append(t, lab, s);
        const d = document.createElement('span');
        d.className = 'd';
        d.textContent = n.date;
        a.append(box, d);
        li.appendChild(a);
        list.appendChild(li);
        rows.push(li);
      });

      function filter(f) {
        let c = 0;
        rows.forEach(function (r) {
          const on = f === 'all' || r.dataset.kind === f;
          r.hidden = !on;
          if (on) c++;
        });
        if (!c) show('이 종류의 노트가 아직 없습니다.'); else msg.hidden = true;
      }
      const tabs = tabsBox.querySelectorAll('.tab');
      tabs.forEach(function (btn) {
        btn.addEventListener('click', function () {
          tabs.forEach(function (x) { x.setAttribute('aria-pressed', x === btn ? 'true' : 'false'); });
          filter(btn.dataset.f);
        });
      });
    })
    .catch(function () {
      show('목록을 불러오지 못했습니다. 파일을 직접 열었다면(file://) 브라우저가 막습니다. 배포된 주소로 열거나, 이 폴더에서 python -m http.server 를 실행해 http://localhost:8000 으로 여세요.');
    });
</script>
</body>
</html>
