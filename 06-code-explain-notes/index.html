<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 해설 노트 보관함</title>
<style>
  :root { --bg:#fafaf7; --fg:#222; --muted:#666; --line:#ddd; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1b1a; --fg:#eee; --muted:#aaa; --line:#3a3a38; --accent:#7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  ul { list-style:none; margin:0; padding:0; }
  li { border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
  li a { display:block; padding:12px 16px; color:inherit; text-decoration:none; }
  li a:hover { border-color:var(--accent); background:rgba(127,127,127,.08); border-radius:8px; }
  .title { font-weight:600; color:var(--accent); }
  .date { color:var(--muted); font-size:.85rem; }
  .msg { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>코드 해설 노트 보관함</h1>
  <p class="sub">코드를 쉬운 주석, 단어장, 그림으로 바꿔 모아 둔 노트입니다. 최신 노트가 위에 있습니다.</p>
  <ul id="list"></ul>
  <p class="msg" id="msg">불러오는 중…</p>
</main>
<script>
  const list = document.getElementById('list');
  const msg = document.getElementById('msg');

  function show(text) { msg.textContent = text; msg.hidden = false; }

  fetch('notes/index.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (notes) {
      if (!notes.length) { show('아직 노트가 없습니다. Claude Code에서 /explain-code 로 만들어 보세요.'); return; }
      notes.sort(function (a, b) { return b.date.localeCompare(a.date); });
      msg.hidden = true;
      notes.forEach(function (n) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = 'notes/' + encodeURIComponent(n.id) + '/index.html';
        const t = document.createElement('div');
        t.className = 'title';
        t.textContent = n.title;
        const s = document.createElement('div');
        s.textContent = n.summary;
        const d = document.createElement('div');
        d.className = 'date';
        d.textContent = n.date;
        a.append(t, s, d);
        li.appendChild(a);
        list.appendChild(li);
      });
    })
    .catch(function () {
      show('목록을 불러오지 못했습니다. 파일을 직접 열었다면(file://) 브라우저가 막습니다. GitHub Pages 주소로 열거나, 이 폴더에서 python -m http.server 를 실행해 http://localhost:8000 으로 여세요.');
    });
</script>
</body>
</html>
